runtime: python39
entrypoint: gunicorn -b :$PORT main:app

handlers:
  # Serve static files (CSS, JavaScript, images)
- url: /static
  static_dir: static

  # Dynamic URLs
- url: /.*
  script: auto

# Define environment variables
env_variables:
  GOOGLE_CLOUD_PROJECT: "phrasal-verve-450403-q1"
  CLOUD_STORAGE_BUCKET: "phrasal-verve-450403-q1.appspot.com"
  